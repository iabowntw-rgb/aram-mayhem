name: 每日更新資料並部署

on:
  schedule:
    - cron: "0 20 * * *"   # 每天台灣時間 04:00
  workflow_dispatch:        # 可在 GitHub 網頁上手動執行
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 OP.GG 大混戰資料
        run: python -X utf8 scraper/scrape.py --out site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
